name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: reg233/whois-domain-lookup:latest

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader --prefer-dist

      - name: Generate hashed assets
        run: sh scripts/hash-assets.sh

      - name: Set up release zip file
        run: zip -rq whois-domain-lookup.zip assets/ config/ src/ vendor/ .htaccess favicon.ico robots.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: whois-domain-lookup.zip
